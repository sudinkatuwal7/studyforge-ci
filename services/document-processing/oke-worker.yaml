apiVersion: v1
kind: ServiceAccount
metadata:
  name: processing-worker
  namespace: studyforge
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studyforge-processing-worker
  namespace: studyforge
data:
  PROCESSING_DB_SSLMODE: verify-full
  PROCESSING_DB_SSLROOTCERT: /etc/studyforge/trust/postgres-ca.pem
  PROCESSING_DJANGO_API_URL: https://studyforge-rodians.duckdns.org
  PROCESSING_SOURCE_MODE: s3
  PROCESSING_REQUIRE_DIRECT_STORAGE: "1"
  STUDYFORGE_REQUIRE_SECURE_CONNECTIONS: "1"
  AWS_EC2_METADATA_DISABLED: "true"
  DJANGO_SETTINGS_MODULE: processing_service.settings
  PROCESSING_ALLOWED_HOSTS: localhost,127.0.0.1,document-processing
  PROCESSING_REDIS_VISIBILITY_TIMEOUT: "3600"
  EMBEDDING_MODEL: gemini-embedding-2
  EMBEDDING_DIMENSION: "768"
  EMBEDDING_BATCH_SIZE: "16"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studyforge-processing-runtime
  namespace: studyforge
data:
  PROCESSING_DB_HOST: 10.0.0.234
  PROCESSING_DB_PORT: "5432"
  PROCESSING_DB_NAME: studyforge_processing
  PROCESSING_DB_USER: studyforge_processing
  PROCESSING_STORAGE_BUCKET: studyforge-documents-dev
  PROCESSING_STORAGE_REGION: us-phoenix-1
  PROCESSING_STORAGE_ENDPOINT_URL: https://axcyydnoof5f.compat.objectstorage.us-phoenix-1.oraclecloud.com
  PROCESSING_STORAGE_ADDRESSING_STYLE: path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-worker
  namespace: studyforge
  labels:
    app.kubernetes.io/name: processing-worker
    app.kubernetes.io/part-of: studyforge
    app.kubernetes.io/component: document-processing
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: processing-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processing-worker
        app.kubernetes.io/part-of: studyforge
        app.kubernetes.io/component: document-processing
    spec:
      serviceAccountName: processing-worker
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      terminationGracePeriodSeconds: 150
      imagePullSecrets:
        - name: ocir-pull-secret
      hostAliases:
        - ip: 10.0.0.234
          hostnames:
            - studyforge-rodians.duckdns.org
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: processing-worker
          # Published linux/arm64 image verified in SCRUM-122 Phase 2.
          image: phx.ocir.io/axcyydnoof5f/studyforge/document-processing@sha256:c07d7b5d5fd4b089f65617733e100f0f062cd76122fe10366c3496b0f14858f6
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              python -c "$WORKER_DEPENDENCY_CHECK"
              exec "$@"
            - worker-entrypoint
          args:
            - celery
            - -A
            - processing_service.celery:app
            - worker
            - --loglevel=INFO
            - --concurrency=1
            - --prefetch-multiplier=1
            - --queues=document-processing
            - --hostname=processing-worker@%h
          envFrom:
            - configMapRef:
                name: studyforge-processing-worker
          env:
            # Run before subscribing to Redis and reuse for Kubernetes probes.
            - name: WORKER_DEPENDENCY_CHECK
              value: &dependency-check |
                from urllib.parse import urlsplit

                import django
                django.setup()

                from django.conf import settings
                from django.test import RequestFactory
                from processing_service.health import ready

                broker = urlsplit(settings.PROCESSING_REDIS_URL)
                if not broker.username or not broker.password:
                    raise SystemExit("A named, authenticated Redis worker credential is required")
                response = ready(RequestFactory().get("/ready/"))
                if response.status_code != 200:
                    raise SystemExit(response.content.decode())
            - name: PROCESSING_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: studyforge-processing-runtime
                  key: PROCESSING_DB_HOST
            - name: PROCESSING_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: studyforge-processing-runtime
                  key: PROCESSING_DB_PORT
            - name: PROCESSING_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: studyforge-processing-runtime
                  key: PROCESSING_DB_NAME
            - name: PROCESSING_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: studyforge-processing-runtime
                  key: PROCESSING_DB_USER
            - name: PROCESSING_STORAGE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: studyforge-processing-runtime
                  key: PROCESSING_STORAGE_BUCKET
            - name: PROCESSING_STORAGE_REGION
              valueFrom:
                configMapKeyRef:
                  name: studyforge-processing-runtime
                  key: PROCESSING_STORAGE_REGION
            - name: PROCESSING_STORAGE_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: studyforge-processing-runtime
                  key: PROCESSING_STORAGE_ENDPOINT_URL
                  optional: true
            - name: PROCESSING_STORAGE_CA_BUNDLE
              valueFrom:
                configMapKeyRef:
                  name: studyforge-processing-runtime
                  key: PROCESSING_STORAGE_CA_BUNDLE
                  optional: true
            - name: PROCESSING_STORAGE_ADDRESSING_STYLE
              valueFrom:
                configMapKeyRef:
                  name: studyforge-processing-runtime
                  key: PROCESSING_STORAGE_ADDRESSING_STYLE
                  optional: true
            - name: PROCESSING_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: studyforge-processing-secrets
                  key: PROCESSING_REDIS_URL
            - name: PROCESSING_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: studyforge-processing-secrets
                  key: PROCESSING_SECRET_KEY
            - name: PROCESSING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: studyforge-processing-secrets
                  key: PROCESSING_DB_PASSWORD
            - name: PROCESSING_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: studyforge-processing-secrets
                  key: PROCESSING_SERVICE_TOKEN
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: studyforge-processing-secrets
                  key: GEMINI_API_KEY
            - name: PROCESSING_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: studyforge-processing-secrets
                  key: PROCESSING_STORAGE_ACCESS_KEY_ID
                  optional: true
            - name: PROCESSING_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: studyforge-processing-secrets
                  key: PROCESSING_STORAGE_SECRET_ACCESS_KEY
                  optional: true
            - name: PROCESSING_STORAGE_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: studyforge-processing-secrets
                  key: PROCESSING_STORAGE_SESSION_TOKEN
                  optional: true
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            exec:
              command:
                - python
                - -c
                - *dependency-check
            periodSeconds: 10
            timeoutSeconds: 20
            failureThreshold: 15
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - *dependency-check
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import sys; cmd=open('/proc/1/cmdline','rb').read().replace(b'\0',b' ');
                  sys.exit(0 if b'celery' in cmd and b'worker' in cmd else 1)
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: trust
              mountPath: /etc/studyforge/trust
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: trust
          configMap:
            name: studyforge-processing-trust
